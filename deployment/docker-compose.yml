version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deployment/Dockerfile.backend
    container_name: gallardo-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=supersecretkey_production_123 # Ganti dengan secret Anda yang kuat
    ports:
      - "5000:5000"
    networks:
      - gallardo-network

  frontend:
    build:
      context: ../
      dockerfile: deployment/Dockerfile.frontend
    container_name: gallardo-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - gallardo-network

networks:
  gallardo-network:
    driver: bridge
